name: Release

# Every push to main that touches addon files gets a new version tag, a packaged
# zip, a GitHub release, and a CurseForge upload.
#
# Version bump is derived from the commit messages since the previous tag:
#   "feat: ..."                         -> minor (1.2.3 -> 1.3.0)
#   "feat!: ..." / "BREAKING CHANGE:"   -> major (1.2.3 -> 2.0.0)
#   anything else                       -> patch (1.2.3 -> 1.2.4)
#
# Put "[skip ci]" in a commit message to push without releasing.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  INITIAL_VERSION: "1.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag next version
        run: |
          set -euo pipefail
          pattern='[0-9]*.[0-9]*.[0-9]*'

          existing=$(git tag --points-at HEAD --list "$pattern" | head -n1)
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged $existing; re-packaging that version."
            exit 0
          fi

          last=$(git tag --merged HEAD --list "$pattern" --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="$INITIAL_VERSION"
          else
            IFS=. read -r major minor patch <<< "$last"
            log=$(git log --format='%s%n%b' "$last..HEAD")
            if grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:|^BREAKING[ -]CHANGE:' <<< "$log"; then
              next="$((major + 1)).0.0"
            elif grep -Eiq '^feat(\([^)]*\))?:' <<< "$log"; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "Previous version: ${last:-none} -> releasing $next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
